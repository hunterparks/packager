<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Track packages from USPS, UPS, FedEx, Amazon and more. Your data stays in your browser."
    />
    <title>Packager</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="app-header__title">Packager</h1>
        <div class="app-header__actions">
          <!-- Enabled by js/main.js when the browser has camera access (HTTPS or localhost). -->
          <button type="button" id="scan-button" class="add-button" aria-label="Scan QR code to add package" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <line x1="12" y1="10" x2="12" y2="17" />
              <line x1="8.5" y1="13.5" x2="15.5" y2="13.5" />
            </svg>
          </button>
          <button type="button" id="add-button" class="add-button" aria-label="Add package">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-state__icon" role="img" aria-label="package">📦</span>
        <p class="empty-state__title">No packages yet</p>
        <p class="empty-state__hint">Tap + to add your first package</p>
      </div>

      <ul id="package-list" class="package-list"></ul>
    </main>

    <!-- One package in the list. Cloned and filled in by js/package-card.js. -->
    <template id="package-card-template">
      <li class="card">
        <!-- Carrier badge: opens the carrier's tracking page -->
        <a class="badge" target="_blank" rel="noopener noreferrer">
          <span class="badge__name"></span>
          <svg class="badge__icon" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15,3 21,3 21,9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>

        <div class="card__info">
          <p class="card__label"></p>
          <p class="card__delivery" hidden></p>
          <p class="card__tracking"></p>
          <p class="card__notes" hidden></p>
        </div>

        <div class="card__actions">
          <button type="button" class="icon-button" data-action="edit" aria-label="Edit package">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </button>
          <button type="button" class="icon-button icon-button--danger" data-action="delete" aria-label="Delete package">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3,6 5,6 21,6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
          </button>
        </div>
      </li>
    </template>

    <!-- Add / edit package. Controlled by js/package-dialog.js. -->
    <dialog id="package-dialog" class="sheet" aria-labelledby="package-dialog-title">
      <form id="package-form" class="sheet__content" novalidate>
        <h2 id="package-dialog-title" class="dialog-title">Add Package</h2>

        <div class="field">
          <label class="field__label" for="field-label">
            Label <span class="field__required">*</span>
          </label>
          <input id="field-label" name="label" type="text" class="input" placeholder="e.g. Birthday Gift" autofocus />
          <p class="field__error" data-error-for="label" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="field-tracking-number">
            Tracking Number <span class="field__required">*</span>
          </label>
          <input
            id="field-tracking-number"
            name="trackingNumber"
            type="text"
            class="input"
            placeholder="Enter tracking number"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
          />
          <p class="field__error" data-error-for="trackingNumber" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="field-carrier">
            Carrier <span class="field__required">*</span>
          </label>
          <select id="field-carrier" name="carrier" class="input">
            <option value="">Select carrier…</option>
            <!-- Carrier options are added from js/carriers.js -->
          </select>
          <p class="field__error" data-error-for="carrier" hidden></p>
        </div>

        <div class="field">
          <div class="field__label-row">
            <label class="field__label" for="field-estimated-delivery">Estimated Delivery</label>
            <button type="button" id="clear-date-button" class="link-button" hidden>Clear</button>
          </div>
          <input id="field-estimated-delivery" name="estimatedDelivery" type="date" class="input input--date" />
        </div>

        <div class="field">
          <label class="field__label" for="field-notes">Notes</label>
          <textarea id="field-notes" name="notes" class="input input--textarea" rows="2" placeholder="Optional notes…"></textarea>
        </div>

        <div class="dialog-actions">
          <button type="button" class="button button--secondary" data-action="cancel">Cancel</button>
          <button type="submit" id="package-submit-button" class="button button--primary">Add Package</button>
        </div>
      </form>
    </dialog>

    <!-- QR code scanner. Controlled by js/scan-dialog.js. -->
    <dialog id="scan-dialog" class="modal" aria-labelledby="scan-dialog-title">
      <h2 id="scan-dialog-title" class="dialog-title dialog-title--compact">Scan QR Code</h2>
      <div class="scanner">
        <video class="scanner__video" autoplay muted playsinline></video>
        <div class="scanner__frame" aria-hidden="true"></div>
      </div>
      <p id="scan-dialog-message" class="modal__message" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="button button--secondary" data-action="cancel">Cancel</button>
      </div>
    </dialog>

    <!-- Delete confirmation. Controlled by js/delete-dialog.js. -->
    <dialog id="delete-dialog" class="modal" aria-labelledby="delete-dialog-title">
      <h2 id="delete-dialog-title" class="dialog-title dialog-title--compact">Delete Package?</h2>
      <p class="modal__message">
        Delete <strong id="delete-dialog-name" class="modal__emphasis"></strong>? This cannot be undone.
      </p>
      <div class="dialog-actions">
        <button type="button" class="button button--secondary" data-action="cancel">Cancel</button>
        <button type="button" class="button button--danger" data-action="confirm">Delete</button>
      </div>
    </dialog>
  </body>
</html>
